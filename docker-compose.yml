version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soca-ai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - soca-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soca-ai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - soca-network

networks:
  soca-network:
    driver: bridge
