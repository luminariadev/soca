<!doctype html>
<html class="dark" lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>SOCA • Smart Ocular Condition Analyzer | Clinical Vision AI</title>
    
    <!-- Clinical Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- MediaPipe Face Mesh & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <!-- Tailwind CSS CDN & Design System Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background": "#0f141c",
              "surface": "#0f141c",
              "surface-dim": "#0f141c",
              "surface-bright": "#343942",
              "surface-container-lowest": "#090e16",
              "surface-container-low": "#171c24",
              "surface-container": "#1b2028",
              "surface-container-high": "#252a33",
              "surface-container-highest": "#30353e",
              "on-surface": "#dee2ee",
              "on-surface-variant": "#c0c6d6",
              "outline": "#8b91a0",
              "outline-variant": "#414754",
              "surface-tint": "#aac7ff",
              "primary": "#aac7ff",
              "on-primary": "#003064",
              "primary-container": "#3e90ff",
              "on-primary-container": "#002957",
              "primary-fixed": "#d6e3ff",
              "secondary": "#c2c1ff",
              "secondary-container": "#3630bf",
              "on-secondary": "#1800a7",
              "on-secondary-container": "#b1b1ff",
              "tertiary": "#47e266",
              "tertiary-container": "#00a73e",
              "on-tertiary": "#003910",
              "on-tertiary-container": "#00320d",
              "error": "#ffb4ab",
              "error-container": "#93000a",
              "on-error": "#690005",
              "on-error-container": "#ffdad6"
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"]
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "1.5rem",
              xl: "2rem",
              "2xl": "2.5rem"
            }
          }
        }
      }
    </script>

    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
          background-color: #0f141c;
          color: #dee2ee;
          font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
          width: 6px;
          height: 6px;
        }
        ::-webkit-scrollbar-track {
          background: #0f141c;
        }
        ::-webkit-scrollbar-thumb {
          background: #252a33;
          border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #3e90ff;
        }
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.fill-1 {
        font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
