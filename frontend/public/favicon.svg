<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Medical Deep Slate Hexagon/Circle Base -->
  <rect width="64" height="64" rx="16" fill="#0B132B"/>
  
  <!-- Outer Ophthalmic Palpebral Aperture -->
  <path d="M 8 32 C 18 16, 46 16, 56 32 C 46 48, 18 48, 8 32 Z" 
        stroke="#38BDF8" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="#0F172A"/>

  <!-- Inner Iris Disc (Clinical Cobalt) -->
  <circle cx="32" cy="32" r="11" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Medical Pupil Core -->
  <circle cx="32" cy="32" r="5.5" fill="#020617"/>

  <!-- Corneal Light Reflex (Specular Highlight) -->
  <circle cx="29.5" cy="29.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="34.5" cy="34.5" r="1" fill="#7DD3FC"/>
</svg>
